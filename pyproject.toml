[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-structures"
version = "0.1.0"
description = "Research scripts for evolutionary game simulations on networks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.0",
    "matplotlib==3.11.1",
    "networkx==3.2.1",
    "scipy==1.17.1",
    "powerlaw==1.5",
    "openpyxl==3.1.2",
    "pyarrow==15.0.0",
    "nashpy==0.0.40",
]

[tool.setuptools]
py-modules = ["Payofffunction", "NetworkProperties"]